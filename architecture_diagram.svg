<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .box { fill: #ffffff; stroke: #2c3e50; stroke-width: 2; rx: 8; }
    .loop-box { fill: #eaf2fb; stroke: #2f6fb0; stroke-width: 2; rx: 8; }
    .mem-box { fill: #fdf3e3; stroke: #b0792f; stroke-width: 2; rx: 8; }
    .tool-box { fill: #eafbf0; stroke: #2fb06a; stroke-width: 2; rx: 8; }
    .title { font-size: 20px; font-weight: bold; fill: #1a1a1a; }
    .label { font-size: 14px; fill: #1a1a1a; }
    .small { font-size: 11px; fill: #444444; }
    .arrow { stroke: #2c3e50; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>

  <text x="600" y="30" text-anchor="middle" class="title">Autonomous Financial Research Agent — Architecture</text>

  <!-- Intake -->
  <rect x="40" y="60" width="220" height="60" class="box"/>
  <text x="150" y="85" text-anchor="middle" class="label">Query (user)</text>
  <text x="150" y="105" text-anchor="middle" class="label">OR Event Detector</text>

  <!-- Entity Resolution -->
  <rect x="300" y="60" width="220" height="60" class="box"/>
  <text x="410" y="85" text-anchor="middle" class="label">Entity Resolution</text>
  <text x="410" y="105" text-anchor="middle" class="small">NER + disambiguation + jurisdiction</text>

  <!-- Planner -->
  <rect x="560" y="60" width="240" height="60" class="loop-box"/>
  <text x="680" y="85" text-anchor="middle" class="label">Planner (LLM)</text>
  <text x="680" y="105" text-anchor="middle" class="small">research_principles.md loaded</text>

  <!-- arrows top row -->
  <path d="M260,90 L300,90" class="arrow"/>
  <path d="M520,90 L560,90" class="arrow"/>

  <!-- Executor -->
  <rect x="440" y="170" width="280" height="60" class="loop-box"/>
  <text x="580" y="195" text-anchor="middle" class="label">Executor (parallel wave)</text>
  <text x="580" y="215" text-anchor="middle" class="small">dispatches sub-tasks to Tool Registry</text>
  <path d="M680,120 L680,150 L580,150 L580,170" class="arrow"/>

  <!-- Tool Registry -->
  <rect x="40" y="270" width="360" height="180" class="tool-box"/>
  <text x="220" y="292" text-anchor="middle" class="label">Tool Registry (10+ tools)</text>
  <text x="60" y="315" class="small">US: EDGAR filings, XBRL financials,</text>
  <text x="60" y="332" class="small">  Alpha Vantage, FMP transcripts, Form 4</text>
  <text x="60" y="353" class="small">India: MCA filings, SEBI circulars,</text>
  <text x="60" y="370" class="small">  NSE/BSE data</text>
  <text x="60" y="391" class="small">Shared: News, Web search, FinBERT</text>
  <text x="60" y="408" class="small">  sentiment, peers, OCR fallback</text>
  <text x="60" y="429" class="small">Every tool: primary -> fallback chain</text>
  <path d="M440,220 L220,270" class="arrow"/>

  <!-- Preprocessing -->
  <rect x="440" y="270" width="280" height="80" class="box"/>
  <text x="580" y="295" text-anchor="middle" class="label">Preprocessing</text>
  <text x="580" y="315" text-anchor="middle" class="small">NER/disambiguation on raw text</text>
  <text x="580" y="333" text-anchor="middle" class="small">OCR fallback on scanned docs</text>
  <path d="M580,230 L580,270" class="arrow"/>

  <!-- Short-term memory -->
  <rect x="780" y="270" width="220" height="80" class="mem-box"/>
  <text x="890" y="295" text-anchor="middle" class="label">Short-Term Memory</text>
  <text x="890" y="315" text-anchor="middle" class="small">per-run, in-process</text>
  <text x="890" y="333" text-anchor="middle" class="small">facts + provenance</text>
  <path d="M720,310 L780,310" class="arrow"/>

  <!-- Replan checkpoint -->
  <rect x="440" y="400" width="280" height="70" class="loop-box"/>
  <text x="580" y="425" text-anchor="middle" class="label">Re-planning Checkpoint</text>
  <text x="580" y="445" text-anchor="middle" class="small">(max 3 cycles) — gaps? -> new sub-tasks</text>
  <path d="M580,350 L580,400" class="arrow"/>
  <path d="M440,435 C 350,435 350,200 440,200" class="arrow"/>
  <text x="330" y="300" class="small" transform="rotate(-90 330 300)">loop back to Executor</text>

  <!-- Synthesis engine -->
  <rect x="440" y="510" width="280" height="90" class="loop-box"/>
  <text x="580" y="533" text-anchor="middle" class="label">Synthesis Engine</text>
  <text x="580" y="551" text-anchor="middle" class="small">tier + recency conflict resolution</text>
  <text x="580" y="567" text-anchor="middle" class="small">facet merge, fiscal normalization</text>
  <text x="580" y="583" text-anchor="middle" class="small">evidence-linked hypotheses</text>
  <path d="M580,470 L580,510" class="arrow"/>

  <!-- Long term memory -->
  <rect x="780" y="510" width="220" height="90" class="mem-box"/>
  <text x="890" y="533" text-anchor="middle" class="label">Long-Term Memory</text>
  <text x="890" y="551" text-anchor="middle" class="small">Chroma vector DB</text>
  <text x="890" y="567" text-anchor="middle" class="small">entity-tagged chunks</text>
  <text x="890" y="583" text-anchor="middle" class="small">of filings/transcripts/news</text>
  <path d="M780,340 C 900,400 900,450 890,510" class="arrow"/>
  <path d="M780,555 L720,555" class="arrow"/>

  <!-- Report generator -->
  <rect x="440" y="640" width="280" height="70" class="box"/>
  <text x="580" y="665" text-anchor="middle" class="label">Report Generator</text>
  <text x="580" y="685" text-anchor="middle" class="small">Financial / Sentiment / Risk / Hypotheses</text>
  <path d="M580,600 L580,640" class="arrow"/>

  <!-- Episodic memory -->
  <rect x="60" y="640" width="300" height="90" class="mem-box"/>
  <text x="210" y="663" text-anchor="middle" class="label">Episodic Memory</text>
  <text x="210" y="681" text-anchor="middle" class="small">SQLite — full run log</text>
  <text x="210" y="697" text-anchor="middle" class="small">every tool call, decision, replan</text>
  <text x="210" y="713" text-anchor="middle" class="small">feeds evaluation harness replay</text>
  <path d="M440,675 L360,675" class="arrow"/>
  <path d="M580,470 C 250,470 250,550 250,640" class="arrow" stroke-dasharray="4,3"/>

  <!-- Evaluation harness -->
  <rect x="800" y="640" width="340" height="90" class="box"/>
  <text x="970" y="663" text-anchor="middle" class="label">Evaluation Harness</text>
  <text x="970" y="681" text-anchor="middle" class="small">20+ metrics: correctness, completeness,</text>
  <text x="970" y="697" text-anchor="middle" class="small">process quality, output quality</text>
  <text x="970" y="713" text-anchor="middle" class="small">across 8 progressive challenges</text>
  <path d="M720,675 L800,675" class="arrow"/>
  <path d="M360,700 C 550,780 750,780 800,700" class="arrow" stroke-dasharray="4,3"/>

  <text x="600" y="800" text-anchor="middle" class="small">Solid arrows: primary data flow. Dashed arrows: logging / evaluation replay feeds.</text>
  <text x="600" y="820" text-anchor="middle" class="small">Blue = cognitive loop components. Amber = memory layers. Green = tool registry.</text>
</svg>